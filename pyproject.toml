[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "carecircle"
version = "0.2.0"
description = "Synthetic multi-agent care coordination through MCP, Strands, and Bedrock"
requires-python = ">=3.11"
dependencies = [
  "boto3>=1.43,<2",
  "botocore[crt]>=1.43,<2",
  "mcp>=1.23,<2",
  "strands-agents>=1.18,<2",
  "pydantic>=2.11,<3",
  "pydantic-settings>=2.10,<3",
  "starlette>=0.47,<1",
  "uvicorn>=0.30,<1",
]

[project.scripts]
carecircle = "carecircle.app:main"
carecircle-web = "carecircle.web:main"

[dependency-groups]
dev = ["pytest>=8,<10", "pytest-asyncio>=1,<2", "httpx>=0.28,<1"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
