AWSTemplateFormatVersion: "2010-09-09"
Description: Minimal CDK bootstrap resources for the CareCircle Phase 3 AgentCore stack

Parameters:
  TrustedAccounts:
    Type: CommaDelimitedList
    Default: ""
  TrustedAccountsForLookup:
    Type: CommaDelimitedList
    Default: ""
  CloudFormationExecutionPolicies:
    Type: CommaDelimitedList
    Description: Managed policy ARNs attached to the CloudFormation execution role
  FileAssetsBucketName:
    Type: String
    Default: ""
  FileAssetsBucketKmsKeyId:
    Type: String
    Default: ""
  ContainerAssetsRepositoryName:
    Type: String
    Default: ""
  Qualifier:
    Type: String
    Default: hnb659fds
    AllowedPattern: "[A-Za-z0-9_-]{1,10}"
  PublicAccessBlockConfiguration:
    Type: String
    Default: "true"
    AllowedValues: ["true", "false"]
  DenyExternalId:
    Type: String
    Default: "true"
    AllowedValues: ["true", "false"]
  InputPermissionsBoundary:
    Type: String
    Default: ""
  UseExamplePermissionsBoundary:
    Type: String
    Default: "false"
    AllowedValues: ["true", "false"]
  BootstrapVariant:
    Type: String
    Default: CareCircle Phase 3 Minimal Bootstrap

Conditions:
  HasCustomFileAssetsBucketName: !Not [!Equals [!Ref FileAssetsBucketName, ""]]
  UsePublicAccessBlockConfiguration: !Equals [!Ref PublicAccessBlockConfiguration, "true"]
  ShouldDenyExternalId: !Equals [!Ref DenyExternalId, "true"]

Resources:
  StagingBucket:
    Type: AWS::S3::Bucket
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      BucketName: !If
        - HasCustomFileAssetsBucketName
        - !Ref FileAssetsBucketName
        - !Sub cdk-${Qualifier}-assets-${AWS::AccountId}-${AWS::Region}
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      PublicAccessBlockConfiguration: !If
        - UsePublicAccessBlockConfiguration
        - BlockPublicAcls: true
          BlockPublicPolicy: true
          IgnorePublicAcls: true
          RestrictPublicBuckets: true
        - !Ref AWS::NoValue
      VersioningConfiguration:
        Status: Enabled
      LifecycleConfiguration:
        Rules:
          - Id: CleanupOldVersions
            Status: Enabled
            NoncurrentVersionExpiration:
              NoncurrentDays: 30
          - Id: AbortIncompleteMultipartUploads
            Status: Enabled
            AbortIncompleteMultipartUpload:
              DaysAfterInitiation: 1

  StagingBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref StagingBucket
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: AllowSSLRequestsOnly
            Effect: Deny
            Principal: "*"
            Action: s3:*
            Resource:
              - !GetAtt StagingBucket.Arn
              - !Sub ${StagingBucket.Arn}/*
            Condition:
              Bool:
                aws:SecureTransport: "false"

  FilePublishingRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub cdk-${Qualifier}-file-publishing-role-${AWS::AccountId}-${AWS::Region}
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              AWS: !Ref AWS::AccountId
            Action: sts:AssumeRole
            Condition: !If
              - ShouldDenyExternalId
              - "Null":
                  sts:ExternalId: "true"
              - !Ref AWS::NoValue
          - Effect: Allow
            Principal:
              AWS: !Ref AWS::AccountId
            Action: sts:TagSession
      Tags:
        - Key: aws-cdk:bootstrap-role
          Value: file-publishing

  FilePublishingRolePolicy:
    Type: AWS::IAM::Policy
    Properties:
      PolicyName: !Sub cdk-${Qualifier}-file-publishing-policy-${AWS::AccountId}-${AWS::Region}
      Roles: [!Ref FilePublishingRole]
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Action:
              - s3:AbortMultipartUpload
              - s3:DeleteObject
              - s3:GetBucketLocation
              - s3:GetObject
              - s3:GetObjectVersion
              - s3:ListBucket
              - s3:ListBucketMultipartUploads
              - s3:ListMultipartUploadParts
              - s3:PutObject
            Resource:
              - !GetAtt StagingBucket.Arn
              - !Sub ${StagingBucket.Arn}/*
            Condition:
              StringEquals:
                aws:ResourceAccount: !Ref AWS::AccountId

  DeploymentActionRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub cdk-${Qualifier}-deploy-role-${AWS::AccountId}-${AWS::Region}
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              AWS: !Ref AWS::AccountId
            Action: sts:AssumeRole
            Condition: !If
              - ShouldDenyExternalId
              - "Null":
                  sts:ExternalId: "true"
              - !Ref AWS::NoValue
          - Effect: Allow
            Principal:
              AWS: !Ref AWS::AccountId
            Action: sts:TagSession
      Policies:
        - PolicyName: CareCircleDeployment
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Sid: DeployCareCircleStack
                Effect: Allow
                Action:
                  - cloudformation:CreateChangeSet
                  - cloudformation:CreateStack
                  - cloudformation:DeleteChangeSet
                  - cloudformation:DeleteStack
                  - cloudformation:DescribeChangeSet
                  - cloudformation:DescribeStackEvents
                  - cloudformation:DescribeStacks
                  - cloudformation:ExecuteChangeSet
                  - cloudformation:GetTemplate
                  - cloudformation:GetTemplateSummary
                  - cloudformation:UpdateStack
                Resource:
                  - !Sub arn:${AWS::Partition}:cloudformation:${AWS::Region}:${AWS::AccountId}:stack/AgentCore-CareCirclePhase3-default/*
                  - !Sub arn:${AWS::Partition}:cloudformation:${AWS::Region}:${AWS::AccountId}:changeSet/*/*
              - Sid: PassCareCircleCloudFormationRole
                Effect: Allow
                Action: iam:PassRole
                Resource: !GetAtt CloudFormationExecutionRole.Arn
              - Sid: ReadBootstrapVersion
                Effect: Allow
                Action:
                  - ssm:GetParameter
                  - ssm:GetParameters
                Resource: !Sub arn:${AWS::Partition}:ssm:${AWS::Region}:${AWS::AccountId}:parameter/cdk-bootstrap/${Qualifier}/version
              - Sid: ReadPublishedAssets
                Effect: Allow
                Action:
                  - s3:GetBucketLocation
                  - s3:GetObject
                  - s3:GetObjectVersion
                  - s3:ListBucket
                Resource:
                  - !GetAtt StagingBucket.Arn
                  - !Sub ${StagingBucket.Arn}/*
              - Sid: IdentifyCaller
                Effect: Allow
                Action: sts:GetCallerIdentity
                Resource: "*"
      Tags:
        - Key: aws-cdk:bootstrap-role
          Value: deploy

  CloudFormationExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub cdk-${Qualifier}-cfn-exec-role-${AWS::AccountId}-${AWS::Region}
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: cloudformation.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns: !Ref CloudFormationExecutionPolicies
      Tags:
        - Key: aws-cdk:bootstrap-role
          Value: cfn-exec

  CdkBootstrapVersion:
    Type: AWS::SSM::Parameter
    Properties:
      Type: String
      Name: !Sub /cdk-bootstrap/${Qualifier}/version
      Value: "32"

Outputs:
  BucketName:
    Value: !Ref StagingBucket
  BucketDomainName:
    Value: !GetAtt StagingBucket.RegionalDomainName
  BootstrapVersion:
    Value: "32"
